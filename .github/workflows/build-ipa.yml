- name: Download IPA
  env:
    IPA_URL: ${{ inputs.ipa_url }}
  run: |
    set -euo pipefail

    mkdir -p ipa

    curl --fail --location --silent --show-error \
      --retry 3 \
      --connect-timeout 20 \
      --output ipa/spotify.ipa \
      "$IPA_URL"

    if [[ ! -s ipa/spotify.ipa ]]; then
      echo "::error::The download was empty"
      exit 1
    fi

    if ! unzip -tq ipa/spotify.ipa >/dev/null 2>&1; then
      echo "::error::The URL did not return a valid IPA/ZIP archive"
      echo "Downloaded response:"
      file ipa/spotify.ipa
      exit 1
    fi

    if ! unzip -l ipa/spotify.ipa | grep -Eq 'Payload/[^/]+\.app/'; then
      echo "::error::The ZIP does not contain a Payload/*.app bundle"
      exit 1
    fi
